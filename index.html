<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <img src="Q.jpg"  class="hyperIcon">
</a>

  <title>QTUM(LOG) Scanner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />

  <!-- ZXing Barcode Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- App Modules -->
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
</head>

<body>

  <!-- QTUM Logo + Hyperlink Icon -->
  <div id="logoWrapper">
    <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank" id="qtumLink">
      <svg
        id="quantumLogo"
        viewBox="0 0 100 100"
        aria-label="Quantum Crest"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect x="0" y="0" width="100" height="100" fill="none" />
        <image
          href="Q.jpg"
          x="0"
          y="0"
          width="100"
          height="100"
          preserveAspectRatio="xMidYMid slice"
        />
      </svg>
    </a>
    </a>
  </div>

  <h1>QTUM(LOG)</h1>
  <h2>Native Tools of Julius Hirsch • Verified by Beler Industries</h2>

  <!-- Scanner Shell -->
  <div id="scannerShell">

    <!-- Video Panel -->
    <div id="videoWrapper">
      <video id="video" autoplay playsinline></video>
    </div>

    <!-- Hidden Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Controls -->
    <div id="controls" role="group" aria-label="Scanner Controls">
      <button id="startBtn" type="button">Enable Camera</button>
      <button id="flipBtn" type="button" class="secondary">Flip Camera</button>
      <button id="uploadBtn" type="button" class="secondary">Upload Image</button>
      <button id="sendBtn" type="button" class="secondary">Send Signal</button>
      <button id="photoBtn" type="button">📸 Take Photo</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <!-- Photo Preview -->
    <img id="photoPreview" alt="Captured Photo Preview">

    <!-- Scan Indicator Orb -->
    <div id="scanIndicator" aria-label="Scan Status Indicator"></div>

    <!-- Output Terminal -->
    <div id="output">
      <div id="status" class="neutral">Waiting for scan…</div>
      <div id="payload"></div>
    </div>

  </div>

  <!-- Ledger -->
  <div id="ledgerShell">
    <div id="ledgerTitle">Scan Ledger</div>
    <div id="ledger"></div>
  </div>

</body>
</html>
