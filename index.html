<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QTUM(LOG) · v0.7</title>
  
  <!-- ZXing Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="logoWrapper">
    <a href="#" id="qtumLink">
      <svg id="quantumLogo" viewBox="0 0 100 100">
        <image href="Q.jpg" width="100" height="100" />
      </svg>
    </a>
  </div>
  
  <h1>QTUM(LOG)</h1>
  <h2>Native Tools of Julius Hirsch • v0.9</h2>

  <div id="scannerShell">
    <div id="videoWrapper">
      <video id="video" autoplay playsinline></video>
      <img id="photoPreview" alt="preview">
    </div>
    
    <div id="controls">
      <button id="startBtn">▶ Camera</button>
      <button id="flipBtn" class="secondary">⟳ Flip</button>
      <button id="uploadBtn" class="secondary">⬆ Upload</button>
      <button id="sendBtn" class="secondary">✦ Signal</button>
      <button id="photoBtn">📸 Snap</button>
      <button id="resetLedgerBtn" class="secondary">✕ Reset</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    
    <div id="scanIndicator"></div>
    
    <div id="output">
      <div id="status" class="neutral">⏻ ready</div>
      <div id="payload"></div>
    </div>
  </div>

  <div id="ledgerShell">
    <div id="ledgerTitle">⏺ Scan Ledger</div>
    <div id="ledger"></div>
  </div>

  <!-- Scripts -->
  <script src="ledger.js"></script>
  <script src="scanner.js"></script>
  <script>
    // Initialize everything when DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      const ledger = new QuantumLedger('ledger');
      const scanner = new QtumScanner(ledger);
      window.__scanner = scanner;
      window.__ledger = ledger;
      console.log('QTUM(LOG) v0.7 initialized');
    });
  </script>
</body>
</html>
