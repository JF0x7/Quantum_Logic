<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QAI · Scanner</title>
  
  <!-- ZXing Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MINIMAL HEADER -->
  <header>
    <div class="logo">⏺</div>
    <div>
      <h1>qai<span style="color:var(--muted)">·scan</span></h1>
      <div class="status-bar">
        <span class="dot" id="aiDot"></span>
        <span id="aiStatus">initializing</span>
        <span class="divider">|</span>
        <span id="scanCount">0</span>
      </div>
    </div>
  </header>

  <!-- MAIN - EYES (Scanner) -->
  <main>
    <div class="scanner-view">
      <div class="viewport">
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" alt="preview" />
        <div class="scan-frame" id="scanFrame">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="scan-line"></div>
        </div>
        <div id="scanIndicator"></div>
      </div>

      <div class="controls">
        <button id="startBtn" class="primary">○</button>
        <button id="flipBtn">↻</button>
        <button id="photoBtn">◻</button>
        <button id="uploadBtn">⌂</button>
        <button id="sendBtn">✦</button>
        <button id="clearBtn" class="danger">✕</button>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </div>

      <div class="output">
        <div id="payload"></div>
        <div id="status">ready</div>
      </div>
    </div>

    <!-- BODY (Ledger) -->
    <div class="ledger-view">
      <div class="ledger-header">
        <span>ledger</span>
        <span id="ledgerCount">0</span>
        <div class="ledger-actions">
          <button id="exportBtn" title="export">↓</button>
          <button id="importBtn" title="import">↑</button>
          <input type="file" id="importInput" accept=".json" hidden />
        </div>
      </div>
      <div id="ledger"></div>
    </div>
  </main>

  <!-- SCRIPTS - Brain (QAI) → Eyes (Scanner) → Body (Ledger) -->
  <script src="Qai.js"></script>
  <script src="scanner.js"></script>
  <script src="ledger.js"></script>

  <script>
    // Initialize: Brain → Eyes → Body
    document.addEventListener('DOMContentLoaded', () => {
      const qai = new Qai();
      const scanner = new QtumScanner(qai);
      const ledger = new QuantumLedger('ledger', scanner);

      // Connect scanner to ledger
      scanner.setLedger(ledger);

      // Status updates
      qai.addEventListener('ready', () => {
        document.getElementById('aiDot').className = 'dot online';
        document.getElementById('aiStatus').textContent = 'online';
      });

      qai.addEventListener('error', () => {
        document.getElementById('aiDot').className = 'dot offline';
        document.getElementById('aiStatus').textContent = 'fallback';
      });

      // Update scan count
      scanner.addEventListener('scan', (e) => {
        document.getElementById('scanCount').textContent = e.detail.total;
      });

      // Expose for debugging
      window.__qai = qai;
      window.__scanner = scanner;
      window.__ledger = ledger;

      console.log('⏺ QAI·Scanner ready');
    });
  </script>

</body>
</html>
