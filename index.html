<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>QTUM(LOG)</title>
  <link rel="icon" href="Q.jpg">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@zxing/library@latest" defer></script>
  <script defer src="Qai.js"></script>
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
  <script defer src="scannerLite.js"></script>
  <style>
    body.lite-mode {
      background: #0f260f !important;
      color: #b6ffb6 !important
    }

    body.lite-mode .header h1 {
      color: #7cff7c !important
    }

    body.lite-mode .controls button {
      background: #113d11 !important;
      border: 1px solid #33aa33 !important;
      color: #b6ffb6 !important
    }

    body.lite-mode #status {
      color: #7cff7c !important
    }

    body.lite-mode #payload {
      background: #0f3d0f !important;
      border: 1px solid #33aa33 !important;
      color: #b6ffb6 !important
    }

    body.lite-mode #qaiResults {
      border: 1px solid #33aa33 !important;
      background: #0f3d0f !important
    }

    body.lite-mode .stats,
    body.lite-mode #qaiResults,
    body.lite-mode #flipBtn,
    body.lite-mode #openLinkBtn,
    body.lite-mode #copyBtn,
    body.lite-mode #sendBtn {
      display: none !important
    }

    body.lite-mode .video-wrap,
    body.lite-mode #startBtn {
      display: none !important
    }

    body.lite-mode .ledger .ledger-header button {
      display: none !important
    }

    #scanDot.active {
      background: #7fdb7f;
      box-shadow: 0 0 8px #7fdb7f;
      animation: pulse 1s infinite
    }

    @keyframes pulse {
      0% {
        opacity: .5;
        transform: scale(.9)
      }

      50% {
        opacity: 1;
        transform: scale(1.1)
      }

      100% {
        opacity: .5;
        transform: scale(.9)
      }
    }
  </style>
</head>

<body>

          viewBox="0 0 100 100">
          <image href="Q.jpg" width="100" height="100" />
        </svg></a>

      <h2>Julius Hirsch &amp; Beler Industries</h2>
    </div>

        </div>
      </div><canvas id="canvas" style="display:none;"></canvas>

          id="flipBtn">🔄</button><button id="uploadBtn">📁</button><input type="file" id="fileInput" accept="image/*"
          hidden><button id="openLinkBtn">🌐</button><button id="copyBtn">📋</button><button
          id="sendBtn">📤</button><button id="clearBtn">🧹</button><button id="resetLedgerBtn">🗑️</button><button
          id="liteModeBtn" style="border:2px solid #33aa33;">💡 Lite Mode</button></div>
      <div id="status">🟢 Ready</div>
      <div id="payload"></div>
      <div class="ledger">
        <div class="ledger-header"><span>📚 Ledger</span><span id="ledgerCount">777</span></div>
        <div id="ledger"></div>
      </div>
      <div id="qaiResults" style="display:none;">
        <div id="qaiBody"></div>
      </div>
    </div>
    <div class="footer"><span>QAI v6.0</span><span id="footerTime"></span></div>
  </div>
  <div id="toast"></div>

</body>

</html>
