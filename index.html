<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QTUM(LOG) Scanner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />

  <!-- ZXing Barcode Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- App Modules -->
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
</head>

<body>

  <!-- Skull & Bones Quantum Emblem -->
  <svg id="quantumLogo" viewBox="0 0 100 100" aria-label="Quantum Crest">
    <circle cx="50" cy="50" r="40" stroke="#ff2e88" stroke-width="3" fill="none" />
    <path d="M40 45 Q50 20 60 45 Q50 60 40 45 Z" fill="#2eff88" />
    <circle cx="45" cy="40" r="4" fill="#000" />
    <circle cx="55" cy="40" r="4" fill="#000" />
    <line x1="35" y1="70" x2="65" y2="70" stroke="#ff2e88" stroke-width="3" />
    <line x1="45" y1="75" x2="55" y2="75" stroke="#ff2e88" stroke-width="3" />
  </svg>

  <h1>QTUM(LOG)</h1>
  <h2>Native Tools of Julius Hirsch • Verified by Beler Industries</h2>

  <!-- Scanner Shell -->
  <div id="scannerShell">

    <!-- Video Panel -->
    <div id="videoWrapper">
      <video id="video" autoplay playsinline></video>
    </div>

    <!-- Hidden Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Controls -->
    <div id="controls" role="group" aria-label="Scanner Controls">
      <button id="startBtn" type="button">Enable Camera</button>
      <button id="flipBtn" type="button" class="secondary">Flip Camera</button>
      <button id="uploadBtn" type="button" class="secondary">Upload Image</button>
      <button id="sendBtn" type="button" class="secondary">Send Signal</button>
      <button id="photoBtn" type="button">📸 Take Photo</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <!-- Photo Preview -->
    <img id="photoPreview" alt="Captured Photo Preview">

    <!-- Scan Indicator Orb -->
    <div id="scanIndicator" aria-label="Scan Status Indicator"></div>

    <!-- Output Terminal -->
    <div id="output">
      <div id="status" class="neutral">Waiting for scan…</div>
      <div id="payload"></div>
    </div>

  </div>

  <!-- Ledger -->
  <div id="ledgerShell">
    <div id="ledgerTitle">Scan Ledger</div>
    <div id="ledger"></div>
  </div>

</body>
</html>
