<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="Q.jpg">

  <title>QTUM(LOG)</title>

  <!-- ZXing Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="logoWrapper">
    <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank">
      <svg id="quantumLogo" viewBox="0 0 100 100">
        <image href="Q.jpg" width="100" height="100" />
      </svg>
    </a>
  </div>

  <h1>QTUM(LOG)</h1>
  <h2>Native Tools of Julius Hirsch • Verified by Jared Beler v1.1077 • QAI v0.90</h2>

  <div id="scannerShell">
    <div id="videoWrapper">
      <video id="video" autoplay playsinline></video>
      <img id="photoPreview" alt="preview">
    </div>

    <div id="controls">
      <button id="startBtn">▶ Camera</button>
      <button id="flipBtn" class="secondary">⟳ Flip</button>
      <button id="uploadBtn" class="secondary">⬆ Upload</button>
      <button id="sendBtn" class="secondary">✦ Signal</button>
      <button id="photoBtn">📸 Snap</button>
      <button id="resetLedgerBtn" class="secondary">✕ Reset</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <div id="scanIndicator"></div>

    <div id="output">
      <div id="status" class="neutral">QAI ⏻ ready</div>
      <div id="payload"></div>
    </div>
  </div>

  <div id="ledgerShell">
    <div id="ledgerTitle">⏺ Scan Ledger</div>
    <div id="ledger"></div>
  </div>

  <!-- Correct load order: QAI → Ledger → Scanner -->
  <script type="module" src="Qai.js"></script>
  <script src="ledger.js"></script>
  <script src="scanner.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const qai = new Qai();
      const ledger = new QuantumLedger('ledger');
      const scanner = new QtumScanner(qai, ledger);

      window.__qai = qai;
      window.__ledger = ledger;
      window.__scanner = scanner;

      console.log('QTUM(LOG) v1.1077 initialized with QAI v0.90');
    });
  </script>
</body>
</html>
