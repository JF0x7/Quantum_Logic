<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="Q.jpg">
  <title>QTUM(LOG) Scanner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- QR Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- App Scripts -->
  <script defer src="Qai.js"></script>
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
</head>

<body>

  <!-- QTUM Logo -->
  <div id="logoWrapper">
    <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank" id="qtumLink">
      <svg
        id="quantumLogo"
        viewBox="0 0 100 100"
        aria-label="Quantum Crest"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
      >
        <image
          href="Q.jpg"
          x="0"
          y="0"
          width="100"
          height="100"
          preserveAspectRatio="xMidYMid slice"
        />
      </svg>
    </a>
  </div>

  <h1>⚛ QTUM(LOG) </h1>
  <h2>Native Tools of Julius Hirsch • Verified by Beler Industries</h2>

  <!-- Scanner Shell -->
  <div id="scannerShell">

    <!-- Live Camera Feed -->
    <div id="videoWrapper">
      <video id="video" autoplay playsinline></video>
    </div>

    <!-- Hidden Canvas for Captures -->
    <canvas id="canvas"></canvas>

    <!-- Controls -->
    <div id="controls" role="group" aria-label="Scanner Controls">
      <button id="startBtn" type="button">Enable Camera</button>
      <button id="flipBtn" type="button" class="secondary">Flip Camera</button>
      <button id="uploadBtn" type="button" class="secondary">Upload Image</button>
      <button id="sendBtn" type="button" class="secondary">Send Signal</button>
      <button id="photoBtn" type="button">📸 Take Photo</button>
      <button id="testBtn" type="button" class="secondary">Test Decode</button>
      <button id="resetLedgerBtn" type="button" class="secondary">Reset Ledger</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    </div>

    <!-- Photo Preview -->
    <img id="photoPreview" alt="Captured Photo Preview">

    <!-- Scan Indicator -->
    <div id="scanIndicator" aria-label="Scan Status Indicator"></div>

    <!-- Output -->
    <div id="output">
      <div id="status" class="neutral">Waiting for scan…</div>
      <div id="payload"></div>
    </div>

  </div>

  <!-- Ledger -->
  <div id="ledgerShell">
    <div id="ledgerTitle">Scan Ledger</div>
    <div id="ledger"></div>
  </div>

  <!-- Initialization -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const qai = new Qai();
      const ledger = new QuantumLedger("ledger");
      window.qtumScanner = new QtumScanner(ledger, qai);
    });
  </script>

</body>
</html>
