<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QTUM(LOG)</title>
  <link rel="icon" href="Q.jpg">
  <link rel="stylesheet" href="style.css">

  <!-- jsQR: simple QR decoder that works well on older Safari -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

  <!-- Your existing brains (optional on legacy, but kept) -->
  <script defer src="Qai.js"></script>
  <script defer src="ledger.js"></script>

  <!-- Lite scanner for iOS 12 / Pi -->
  <script defer src="scannerLite.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank">
        <svg width="40" height="40" viewBox="0 0 100 100">
          <image href="Q.jpg" width="100" height="100"/>
        </svg>
      </a>
      <h1>QTUM(LOG)</h1>
      <h2>Beler Industries</h2>
    </div>

    <!-- Scanner -->
    <div class="scanner">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="indicator">
          <div class="dot" id="scanDot"></div>
          <span id="scanStatus">Ready</span>
        </div>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>

      <!-- Controls -->
      <div class="controls">
        <button id="startBtn" data-tip="Start camera">📷</button>
        <button id="stopBtn" data-tip="Stop camera">⏹️</button>
        <button id="uploadBtn" data-tip="Upload image">📁</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button id="copyBtn" data-tip="Copy payload">📋</button>
        <button id="clearBtn" data-tip="Clear all">🧹</button>
      </div>

      <!-- Output -->
      <div id="status">🟢 Ready (Lite)</div>
      <div id="payload"></div>

      <!-- Ledger (optional, still here) -->
      <div class="ledger">
        <div class="ledger-header">
          <span>📚 Ledger</span>
          <span id="ledgerCount">777</span>
        </div>
        <div id="ledger"></div>
      </div>

      <!-- QAI Results (can be filled by Qai.js if you want later) -->
      <div id="qaiResults" style="display:none;">
        <div id="qaiBody"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>QAI v6.0 (Lite)</span>
      <span id="footerTime"></span>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // Tiny toast helper (no fancy classes)
    function showToast(msg) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._hide);
      t._hide = setTimeout(function () {
        t.style.display = 'none';
      }, 2500);
    }

    // Clock
    document.addEventListener('DOMContentLoaded', function () {
      setInterval(function () {
        var el = document.getElementById('footerTime');
        if (el) el.textContent = new Date().toLocaleTimeString();
      }, 1000);
    });
  </script>
</body>
</html>
