<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="Q.jpg">
  <title>QTUM(LOG) Scanner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- ZXing Barcode Scanner -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- App Scripts -->
  <script defer src="Qai.js"></script>
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
</head>

<body>

  <!-- QTUM Logo -->
  <div id="logoWrapper">
    <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank" id="qtumLink">
      <svg
        id="quantumLogo"
        viewBox="0 0 100 100"
        aria-label="Quantum Crest"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
      >
        <image
          href="Q.jpg"
          x="0"
          y="0"
          width="100"
          height="100"
          preserveAspectRatio="xMidYMid slice"
        />
      </svg>
    </a>
  </div>

  <h1>⚛ QTUM(LOG) </h1>
  <h2>Native Tools of Julius Hirsch • Verified by Beler Industries</h2>

  <!-- Scanner Shell -->
  <div id="scannerShell">

    <!-- Live Camera Feed -->
    <div id="videoWrapper">
      <video id="video" autoplay playsinline></video>
    </div>

    <!-- Hidden Canvas for Captures -->
    <canvas id="canvas"></canvas>

    <!-- Primary Controls -->
    <div id="controls" role="group" aria-label="Scanner Controls">
      <button id="startBtn" type="button">Enable Camera</button>
      <button id="flipBtn" type="button" class="secondary">Flip Camera</button>
      <button id="uploadBtn" type="button" class="secondary">Upload Image</button>
      <button id="sendBtn" type="button" class="secondary">Send Signal</button>
      <button id="photoBtn" type="button">📸 Take Photo</button>
      <button id="resetLedgerBtn" type="button" class="secondary">Reset Ledger</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <!-- Advanced Scanning Controls (Collapsible) -->
    <div id="advancedControls" role="group" aria-label="Advanced Scanning Controls">
      <button id="zoomInBtn" type="button" class="secondary" title="Zoom in for small barcodes">🔍+ Zoom In</button>
      <button id="zoomOutBtn" type="button" class="secondary" title="Zoom out">🔍- Zoom Out</button>
      <button id="curvedBtn" type="button" class="secondary" title="Enable curved surface mode">↔ Curved Mode</button>
      <button id="enhancedScanBtn" type="button" class="secondary" title="Try multiple scan techniques">⚡ Enhanced Scan</button>
    </div>

    <!-- Photo Preview -->
    <img id="photoPreview" alt="Captured Photo Preview">

    <!-- Scan Indicator -->
    <div id="scanIndicator" aria-label="Scan Status Indicator"></div>

    <!-- Output -->
    <div id="output">
      <div id="status" class="neutral">Waiting for scan…</div>
      <div id="payload"></div>
    </div>

  </div>

  <!-- Ledger -->
  <div id="ledgerShell">
    <div id="ledgerTitle">Scan Ledger</div>
    <div id="ledger"></div>
  </div>

  <!-- ⭐ FIXED: Initialization -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const qai = new Qai();                     // QAI brain
      const ledger = new QuantumLedger("ledger"); // FIXED: pass container ID
      const scanner = new QtumScanner(ledger, qai); // scanner engine
    });
  </script>

</body>
</html>
