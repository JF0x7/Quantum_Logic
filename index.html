<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <div class="header">
    <a href="https://jf0x7.github.io/OrbitalMechanics//" target="_blank">
     <image src="moon.png" alt="moon" style="width:107px; vertical-align:middle;">
    </a>
    <h1>⚛QTUM(LOG)⚛</h1>
    <h2>Julius Hirsch &amp; Beler Industries</h2>
  </div>
  <title>QTUM(LOG)</title>
  <style>
    /* ===== RESET + FLAT ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #061806;
      color: #c8ffd0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 6px;
    }
    .app {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header {
      text-align: center;
      padding: 4px 0;
    }
    .header h1 {
      font-size: 16px;
      margin: 2px 0;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .header h2 {
      font-size: 8px;
      color: #555;
      font-weight: 400;
    }
    .scanner {
      background: #041204;
      border: 1px solid #145214;
      border-radius: 12px;
      padding: 8px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      margin-top: 6px;
    }
    .controls button {
      padding: 4px 6px;
      border: 1px solid #2fbf2f;
      border-radius: 4px;
      background: #0b260b;
      color: #c8ffd0;
      cursor: pointer;
      font-size: 10px;
      min-width: 30px;
      touch-action: manipulation;
    }
    .controls button:active { background: #1a4a1a; }
    #status {
      padding: 4px 8px;
      font-size: 9px;
      color: #9cff9c;
      text-align: center;
      margin: 4px 0;
      font-family: monospace;
      background: #0b260b;
      border-radius: 4px;
      border: 1px solid #2fbf2f;
      min-height: 20px;
    }
    #payload {
      padding: 4px 8px;
      font-size: 9px;
      color: #c8ffd0;
      text-align: center;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      background: #0b260b;
      border-radius: 4px;
      border: 1px solid #2fbf2f;
      min-height: 20px;
      max-height: 40px;
      overflow-y: auto;
      margin: 2px 0;
    }
    #qaiResults {
      margin: 4px 0;
      padding: 4px 6px;
      background: #0b260b;
      border-radius: 4px;
      border: 1px solid #2fbf2f;
      display: none;
    }
    #qaiBody { font-size: 8px; color: #c8ffd0; max-height: 22px; overflow-y: auto; }
    #qaiBody strong { color: #7cff7c; }

    .ledger {
      background: #041204;
      border: 1px solid #145214;
      border-radius: 12px;
      padding: 6px 8px;
      margin-top: 4px;
    }
    .ledger-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 10px;
      color: #888;
    }
    .ledger-header button {
      background: none;
      border: 1px solid #2fbf2f;
      border-radius: 3px;
      color: #9cff9c;
      cursor: pointer;
      font-size: 8px;
      padding: 2px 6px;
      touch-action: manipulation;
    }
    #ledger {
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }
    /* ===== FLAT LEDGER ITEMS – no shadows, no transforms, no pseudo ===== */
    .ledgerItem {
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: rgba(0,30,0,0.5);
      border: 1px solid #2a7a2a;
    }
    .ledgerPayload {
      font-size: 1em;
      font-weight: bold;
      color: #cfffcf;
      word-break: break-all;
      margin-bottom: 4px;
      font-family: 'Courier New', monospace;
      padding: 4px 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      border-left: 3px solid #2a7a2a;
    }
    .ledgerMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 8px;
      font-size: 0.7em;
      color: #b5d8b5;
      padding: 4px 0;
      border-top: 1px dashed rgba(255,255,255,0.08);
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      margin: 4px 0;
    }
    .ledgerMeta span {
      background: rgba(255,255,255,0.04);
      padding: 1px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .ledgerFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7em;
      color: #8aaa8a;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
      gap: 4px;
    }
    .ledgerTag {
      padding: 1px 10px;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.7em;
    }
    .tag-scan { background: #2a6a2a; color: #8f8; }
    .tag-file_scan { background: #2a4a2a; color: #afa; }
    .tag-url { background: #2a4a6a; color: #8af; }
    .ledgerTime { color: #889; }
    .ledgerExport { display: flex; gap: 6px; margin-left: auto; }
    .export-btn {
      padding: 2px 6px;
      border: 1px solid #2fbf2f;
      border-radius: 3px;
      background: rgba(0,0,0,0.3);
      color: #9cff9c;
      cursor: pointer;
      font-size: 10px;
      touch-action: manipulation;
    }
    .export-btn:active { background: #9cff9c; color: #000; }
    .footer { text-align: center; font-size: 7px; color: #333; padding: 2px 0; }
    #toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 10px;
      background: #041204;
      border: 1px solid #2fbf2f;
      color: #c8ffd0;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    #toast.success { border-color: #0f0; color: #0f0; }
    #toast.error { border-color: #f00; color: #f00; }
    #toast.info { border-color: #0ff; color: #0ff; }
    @media (max-width:480px){ .app{max-width:100%;} .ledgerMeta span{white-space:normal;} }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚛ QTUM(LOG) ⚛</h1>
    <h2>Julius Hirsch &amp; Beler Industries · Lite</h2>
  </div>

  <div class="scanner">
    <div class="controls">
      <button id="uploadBtn">📁 Upload</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button id="openLinkBtn">🌐</button>
      <button id="copyBtn">📋</button>
      <button id="sendBtn">📤</button>
      <button id="clearBtn">🧹</button>
      <button id="resetLedgerBtn">🗑️</button>
    </div>
    <div id="status">📁 Upload any file</div>
    <div id="payload"></div>
    <div id="qaiResults"><div id="qaiBody"></div></div>
    <div class="ledger">
      <div class="ledger-header">
        <span>📚 Ledger</span>
        <span><span id="ledgerCount">0</span> entries</span>
      </div>
      <div id="ledger"></div>
    </div>
  </div>
  <div class="footer"><span>QAI v6.0 · Ultra‑Lite</span><span id="footerTime"></span></div>
</div>
<div id="toast"></div>

<script>
// ======================================================================
//  QTUM(LOG) – ULTRA LITE EDITION (ES5, no crypto/webrtc, capped ledger)
//  Runs on iOS 9+ and Raspberry Pi
// ======================================================================
(function(){
  // -------- HELPERS ----------------------------------------------------
  function showToast(msg, color) {
    color = color || '#9cff9c';
    var old = document.querySelector('.quantum-toast');
    if (old) old.parentNode.removeChild(old);
    var t = document.createElement('div');
    t.className = 'quantum-toast';
    t.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:8px 18px; background:#041204; color:'+color+'; border:1px solid '+color+'; border-radius:6px; font-family:monospace; font-size:12px; z-index:9999; max-width:90%; text-align:center;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300); }, 2500);
  }

  function calcEntropy(str) {
    if (!str || str.length === 0) return '0.00';
    var freq = {};
    var i, ch, p, entropy = 0, len = str.length;
    for (i=0; i<len; i++) { ch = str.charAt(i); freq[ch] = (freq[ch]||0) + 1; }
    for (ch in freq) { p = freq[ch] / len; entropy -= p * Math.log2(p); }
    return entropy.toFixed(2);
  }

  function tryParseJSON(str) {
    if (str.charAt(0) !== '{' && str.charAt(0) !== '[') return false;
    try { JSON.parse(str); return true; } catch(e) { return false; }
  }

  function rot13(str) {
    return str.replace(/[A-Za-z]/g, function(c) {
      return 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.charAt(
        'NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm'.indexOf(c)
      );
    });
  }

  function simpleDecode(str) {
    // Try hex, then base64, else fallback
    var hexMatch = /^[0-9a-fA-F]+$/.test(str);
    if (hexMatch && str.length % 2 === 0) {
      try {
        var bytes = str.match(/.{2}/g).map(function(h){ return parseInt(h,16); });
        return String.fromCharCode.apply(null, bytes).substring(0, 40);
      } catch(e) {}
    }
    var b64Match = /^[A-Za-z0-9+/=]+$/.test(str);
    if (b64Match && str.length >= 4) {
      try { return atob(str).substring(0,40); } catch(e) {}
    }
    return 'n/a';
  }

  // -------- LEDGER (constructor, no class) ----------------------------
  function QuantumLedger(containerId) {
    this.container = document.getElementById(containerId);
    this.entries = [];
    this.MAX_ENTRIES = 50;
  }

  QuantumLedger.prototype.analyzePayload = function(payload) {
    var trimmed = payload.trim();
    var len = trimmed.length;
    var entropy = calcEntropy(trimmed);
    var isURL = /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(trimmed);
    var isJSON = tryParseJSON(trimmed);
    var isHex = /^[0-9a-fA-F]+$/.test(trimmed) && trimmed.length % 2 === 0;
    var isBase64 = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(trimmed) && trimmed.length >= 4;
    var classification = 'UNKNOWN';
    if (isURL) classification = 'URL';
    else if (isJSON) classification = 'JSON';
    else if (isHex) classification = 'HEX';
    else if (isBase64) classification = 'BASE64';
    else if (len < 8) classification = 'SHORT';
    else if (len > 80) classification = 'LONG';
    var charset = /^[\x00-\x7F]+$/.test(trimmed) ? 'ASCII' : 'Extended';
    var decodedPreview = simpleDecode(trimmed);
    var rot = rot13(trimmed);
    // Q‑notes
    var notes = 'Signal: ' + classification + '. Entropy: ' + entropy + '.';
    if (isURL) notes += ' Web link.';
    if (isJSON) notes += ' JSON payload.';
    return {
      length: len,
      entropy: entropy,
      classification: classification,
      charset: charset,
      decodedPreview: decodedPreview,
      rot13: rot,
      qNotes: notes
    };
  };

  QuantumLedger.prototype.addEntry = function(payload, tag, extra) {
    if (!this.container) return;
    var meta = this.analyzePayload(payload);
    var time = new Date().toLocaleTimeString();
    var timestamp = new Date().toISOString();
    var entryData = { timestamp: timestamp, time: time, payload: payload, tag: tag || 'SCAN', meta: meta };
    // keep extra fields if any
    for (var k in extra) { if (extra.hasOwnProperty(k)) entryData[k] = extra[k]; }
    this.entries.push(entryData);

    // Cap ledger
    if (this.entries.length > this.MAX_ENTRIES) {
      var removeCount = this.entries.length - this.MAX_ENTRIES;
      this.entries.splice(0, removeCount);
    }

    // Render
    var item = document.createElement('div');
    item.className = 'ledgerItem';

    var payloadEl = document.createElement('div');
    payloadEl.className = 'ledgerPayload';
    payloadEl.textContent = payload;
    item.appendChild(payloadEl);

    var metaEl = document.createElement('div');
    metaEl.className = 'ledgerMeta';
    metaEl.innerHTML = '<span><strong>Len:</strong> '+meta.length+'</span><span><strong>Entropy:</strong> '+meta.entropy+'</span><span><strong>Type:</strong> '+meta.classification+'</span><span><strong>Charset:</strong> '+meta.charset+'</span><span><strong>Decoded:</strong> '+meta.decodedPreview+'</span><span><strong>ROT13:</strong> '+meta.rot13+'</span><span style="flex:1 1 100%;"><strong>Q‑Notes:</strong> '+meta.qNotes+'</span>';
    item.appendChild(metaEl);

    var footer = document.createElement('div');
    footer.className = 'ledgerFooter';
    var tagSpan = document.createElement('span');
    tagSpan.className = 'ledgerTag tag-'+tag.toLowerCase().replace(/_/g,'');
    tagSpan.textContent = tag;
    var timeSpan = document.createElement('span');
    timeSpan.className = 'ledgerTime';
    timeSpan.textContent = time;
    var exp = document.createElement('div');
    exp.className = 'ledgerExport';
    var copyBtn = document.createElement('button');
    copyBtn.className = 'export-btn';
    copyBtn.textContent = '📋';
    copyBtn.setAttribute('data-index', this.entries.length - 1);
    copyBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var idx = parseInt(this.getAttribute('data-index'), 10);
      var entry = that.entries[idx];
      if (entry) {
        var str = JSON.stringify({ entry: entry, exported: new Date().toISOString() });
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(str).then(function(){ showToast('📋 Copied!'); })['catch'](function(){ showToast('Copy failed','#f00'); });
        } else {
          // fallback
          var ta = document.createElement('textarea');
          ta.value = str;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); showToast('📋 Copied!'); } catch(e) { showToast('Copy failed','#f00'); }
          document.body.removeChild(ta);
        }
      }
    });
    exp.appendChild(copyBtn);
    footer.appendChild(tagSpan);
    footer.appendChild(timeSpan);
    footer.appendChild(exp);
    item.appendChild(footer);

    // Prepend
    this.container.insertBefore(item, this.container.firstChild);

    // Trim DOM if too many
    while (this.container.children.length > this.MAX_ENTRIES) {
      this.container.removeChild(this.container.lastChild);
    }
    var that = this;
  };

  QuantumLedger.prototype.clear = function() {
    if (this.entries.length > 0 && !confirm('Clear '+this.entries.length+' entries?')) return;
    this.container.innerHTML = '';
    this.entries = [];
    showToast('🧹 Cleared');
  };

  QuantumLedger.prototype.count = function() {
    return this.entries.length;
  };

  // -------- QAI (lightweight) -----------------------------------------
  function Qai() {
    this.version = '6.0-lite';
  }

  Qai.prototype.process = function(text) {
    var clean = text.trim();
    var type = 'Plain text';
    if (/^https?:\/\//i.test(clean)) type = 'URL';
    else if (/^0x[a-fA-F0-9]{40}$/.test(clean)) type = 'Ethereum';
    else if (/^[13][a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(clean)) type = 'Bitcoin';
    else if (/^QTUM_/.test(clean)) type = 'QTUM';
    else if (/^[0-9a-fA-F]+$/.test(clean)) type = 'Hex';
    else if (/^[A-Za-z0-9+/=]+$/.test(clean)) type = 'Base64';
    else if (/^\{/.test(clean) || /^\[/.test(clean)) type = 'JSON';
    var entropy = calcEntropy(clean);
    var notes = ['Signal: '+type, 'Entropy: '+entropy];
    return {
      type: type,
      entropy: parseFloat(entropy),
      qnotes: notes,
      processedAt: new Date().toISOString(),
      version: this.version
    };
  };

  // -------- APP ------------------------------------------------------
  var CONFIG = { cooldown: 2000, maxPayload: 400 };

  var el = {
    payload: document.getElementById('payload'),
    status: document.getElementById('status'),
    upload: document.getElementById('uploadBtn'),
    fileInput: document.getElementById('fileInput'),
    send: document.getElementById('sendBtn'),
    openLink: document.getElementById('openLinkBtn'),
    copyBtn: document.getElementById('copyBtn'),
    clearBtn: document.getElementById('clearBtn'),
    resetLedger: document.getElementById('resetLedgerBtn'),
    qaiResults: document.getElementById('qaiResults'),
    qaiBody: document.getElementById('qaiBody'),
    ledgerCount: document.getElementById('ledgerCount')
  };

  var ledger = new QuantumLedger('ledger');
  var brain = new Qai();
  var cooldown = false;
  var lastPayload = null;
  var currentPayload = null;

  function setStatus(msg) {
    if (el.status) el.status.textContent = 'Status: ' + msg;
  }

  function setPayload(data) {
    if (!el.payload) return;
    var display = data.length > CONFIG.maxPayload ? data.substring(0, CONFIG.maxPayload) + '…' : data;
    el.payload.textContent = display;
    el.payload.title = data;
  }

  function updateCount() {
    if (el.ledgerCount) el.ledgerCount.textContent = ledger.count();
  }

  function handleScan(data) {
    if (cooldown && data === lastPayload) return;
    cooldown = true;
    lastPayload = data;
    currentPayload = data;
    setPayload(data);
    setStatus('Decoding…');

    try {
      var analysis = brain.process(data);
      if (el.qaiResults) {
        el.qaiResults.style.display = 'block';
        if (el.qaiBody) {
          var notes = analysis.qnotes ? analysis.qnotes.join(' | ') : '';
          el.qaiBody.innerHTML = '<strong>🧠 QAI:</strong> ' + analysis.type + ' | entropy ' + analysis.entropy + ' | ' + notes;
        }
      }
      ledger.addEntry(data, 'FILE_SCAN', { type: analysis.type });
    } catch(e) {
      ledger.addEntry(data, 'FILE_SCAN', { error: e.message });
    }
    updateCount();
    setStatus('✅ Done');
    setTimeout(function(){ cooldown = false; }, CONFIG.cooldown);
  }

  function handleFileUpload(file) {
    if (!file) return;
    setStatus('Reading file…');
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var payload = 'FILE|' + file.name + '|' + Math.round(file.size/1024) + 'KB|' + img.width + 'x' + img.height + '|' + Date.now();
        handleScan(payload);
        setStatus('✅ File processed');
      };
      img.onerror = function() {
        var payload = 'FILE|' + file.name + '|' + Math.round(file.size/1024) + 'KB|non-image|' + Date.now();
        handleScan(payload);
        setStatus('✅ File processed (non-image)');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // -------- BIND EVENTS (ES5 style) ----------------------------------
  function bindEvents() {
    if (el.upload && el.fileInput) {
      el.upload.addEventListener('click', function() { el.fileInput.click(); });
      el.fileInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (file) handleFileUpload(file);
        e.target.value = '';
      });
    }
    if (el.send) {
      el.send.addEventListener('click', function() {
        var data = el.payload ? el.payload.textContent : '';
        if (data && data !== '') handleScan(data);
        else setStatus('No payload to send');
      });
    }
    if (el.openLink) {
      el.openLink.addEventListener('click', function() {
        var data = currentPayload || (el.payload ? el.payload.textContent : '');
        if (!data || data === '') { setStatus('No payload'); return; }
        if (/^https?:\/\//i.test(data)) {
          window.open(data, '_blank');
          setStatus('🌐 Opened');
        } else {
          if (confirm('Search Google for "' + data.substring(0,40) + '…"?')) {
            window.open('https://www.google.com/search?q=' + encodeURIComponent(data), '_blank');
          }
        }
      });
    }
    if (el.copyBtn) {
      el.copyBtn.addEventListener('click', function() {
        var data = currentPayload || (el.payload ? el.payload.textContent : '');
        if (!data || data === '') { setStatus('Nothing to copy'); return; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data).then(function(){ setStatus('📋 Copied!'); })['catch'](function(){ setStatus('Copy failed'); });
        } else {
          var ta = document.createElement('textarea');
          ta.value = data;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); setStatus('📋 Copied!'); } catch(e) { setStatus('Copy failed'); }
          document.body.removeChild(ta);
        }
      });
    }
    if (el.clearBtn) {
      el.clearBtn.addEventListener('click', function() {
        if (el.payload) el.payload.textContent = '';
        if (el.qaiResults) el.qaiResults.style.display = 'none';
        currentPayload = null;
        setStatus('🧹 Cleared');
      });
    }
    if (el.resetLedger) {
      el.resetLedger.addEventListener('click', function() {
        ledger.clear();
        updateCount();
      });
    }
  }

  // -------- BOOT ----------------------------------------------------
  document.addEventListener('DOMContentLoaded', function() {
    bindEvents();
    updateCount();
    setStatus('📁 Upload any file');
    setInterval(function() {
      var ft = document.getElementById('footerTime');
      if (ft) ft.textContent = new Date().toLocaleTimeString();
    }, 1000);
  });

  window.__ledger = ledger;
  window.__qai = brain;
})();
</script>
</body>
</html>
