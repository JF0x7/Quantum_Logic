<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QTUM(LOG)</title>
  <link rel="icon" href="Q.jpg">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script defer src="Qai.js"></script>
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank">
        <svg width="40" height="40" viewBox="0 0 100 100"><image href="Q.jpg" width="100" height="100"/></svg>
      </a>
      <h1>⚛ QTUM(LOG)</h1>
      <h2>Beler Industries</h2>
    </div>

    <!-- Scanner -->
    <div class="scanner">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="indicator">
          <div class="dot" id="scanDot"></div>
          <span id="scanStatus">Ready</span>
        </div>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>
      
      <!-- Controls -->
      <div class="controls">
        <button id="startBtn" data-tip="Start camera">📷</button>
        <button id="flipBtn" data-tip="Flip camera">🔄</button>
        <button id="uploadBtn" data-tip="Upload image">📁</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button id="openLinkBtn" data-tip="Open URL">🌐</button>
        <button id="copyBtn" data-tip="Copy payload">📋</button>
        <button id="sendBtn" data-tip="Send signal">📤</button>
        <button id="clearBtn" data-tip="Clear all">🧹</button>
        <button id="resetLedgerBtn" data-tip="Reset ledger">🗑️</button>
      </div>

      <!-- Output -->
      <div id="status">🟢 Ready</div>
      <div id="payload"></div>
      
      <!-- Quick Stats -->
      <div class="stats">
        <div><span>Entropy</span><span id="statEntropy">—</span></div>
        <div><span>Type</span><span id="statType">—</span></div>
        <div><span>Risk</span><span id="statRisk">—</span></div>
      </div>

       <!-- Ledger -->
    <div class="ledger">
      <div class="ledger-header">
        <span>📚 Ledger</span>
        <span id="ledgerCount">0</span>
        <button id="ledgerExport" data-tip="Export all">📤</button>
        <button id="ledgerClear" data-tip="Clear ledger">🗑️</button>
      </div>
      <div id="ledger"></div>
    </div>
    
      <!-- QAI Results -->
      <div id="qaiResults" style="display:none;">
        <div id="qaiBody"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>QAI v6.0</span>
      <span id="footerTime"></span>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const qai = new Qai({ enableAztec: true, enableDDN: true, enableMorse: true, enableDeepAnalysis: true });
        const ledger = new QuantumLedger("ledger");
        const scanner = new QtumScanner(ledger, qai);
        window.__qai = qai; window.__ledger = ledger; window.__scanner = scanner;
        
        // Toast system
        window.showToast = (msg, type = 'info') => {
          const t = document.getElementById('toast');
          if(!t) return;
          t.textContent = msg;
          t.className = `toast ${type}`;
          t.style.display = 'block';
          clearTimeout(t._hide);
          t._hide = setTimeout(() => { t.style.display = 'none'; }, 2500);
        };
        
        // Tooltips
        document.querySelectorAll('[data-tip]').forEach(el => {
          el.addEventListener('mouseenter', (e) => {
            const tip = el.getAttribute('data-tip');
            showToast(`💡 ${tip}`, 'info');
          });
        });
        
        // Clock
        setInterval(() => {
          const el = document.getElementById('footerTime');
          if(el) el.textContent = new Date().toLocaleTimeString();
        }, 1000);
        
        // Dot status
        const dot = document.getElementById('scanDot');
        const status = document.getElementById('scanStatus');
        if(dot && status) {
          document.addEventListener('scanStart', () => {
            dot.className = 'dot active';
            status.textContent = 'Scanning';
          });
          document.addEventListener('scanStop', () => {
            dot.className = 'dot';
            status.textContent = 'Ready';
          });
        }
        
        setTimeout(() => showToast('🧠 QAI v6.0 Online', 'success'), 500);
        console.log('✅ QTUM(LOG) Ready');
      } catch(e) {
        console.error('Init failed:', e);
        document.getElementById('status').textContent = `❌ ${e.message}`;
      }
    });
  </script>
</body>
</html>
