<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="Q.jpg">
  <title>QTUM(LOG) Scanner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/webrtc-adapter@8.2.3/release/adapter.js"></script>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <script defer src="Qai.js"></script>
  <script defer src="ledger.js"></script>
  <script defer src="scanner.js"></script>
</head>

<body>

  <div id="logoWrapper">
    <a href="https://qtum-hub-4048d1.gitlab.io/" target="_blank" id="qtumLink">
      <svg
        id="quantumLogo"
        viewBox="0 0 100 100"
        aria-label="Quantum Crest"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
      >
        <image
          href="Q.jpg"
          x="0"
          y="0"
          width="100"
          height="100"
          preserveAspectRatio="xMidYMid slice"
        />
      </svg>
    </a>
  </div>

  <h1>QTUM(LOG)</h1>
  <h2>Native Tools of Julius Hirsch • Verified by Beler Industries</h2>

  <div id="scannerShell">

    <div id="videoWrapper">
      <video id="video" autoplay playsinline webkit-playsinline muted></video>
    </div>

    <canvas id="canvas"></canvas>

    <div id="controls" role="group" aria-label="Scanner Controls">
      <button id="startBtn" type="button">Enable Camera</button>
      <button id="flipBtn" type="button" class="secondary">Flip Camera</button>
      <button id="uploadBtn" type="button" class="secondary">Upload Image</button>
      <button id="sendBtn" type="button" class="secondary">Send Signal</button>
      <button id="photoBtn" type="button">📸 Take Photo</button>
      <button id="resetLedgerBtn" type="button" class="secondary">Reset Ledger</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <img id="photoPreview" alt="Captured Photo Preview">

    <div id="scanIndicator" aria-label="Scan Status Indicator"></div>

    <div id="output">
      <div id="status" class="neutral">Waiting for scan…</div>
      <div id="payload"></div>
    </div>

  </div>

  <div id="ledgerShell">
    <div id="ledgerTitle">Scan Ledger</div>
    <div id="ledger"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Safety checks to prevent older JS runtimes from hard-crashing if classes are absent
      try {
        const qai = typeof Qai !== 'undefined' ? new Qai() : null;
        const ledger = typeof QuantumLedger !== 'undefined' ? new QuantumLedger("ledger") : null;
        const scanner = typeof QtumScanner !== 'undefined' ? new QtumScanner(ledger, qai) : null;
      } catch (e) {
        console.error("Initialization failed: Older device runtime error.", e);
      }
    });
  </script>

</body>
</html>
